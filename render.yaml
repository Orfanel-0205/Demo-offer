# Render Blueprint (optional)
# Creates the free static site with the right settings in one step:
#   Render dashboard → New + → Blueprint → select this repository → Apply.
# You can also create the site by hand: New + → Static Site, publish directory "site".
services:
  - type: web
    runtime: static
    name: bright-site-tech
    # No build step: the site is plain HTML, CSS and JavaScript.
    buildCommand: echo "No build step needed"
    # Only the site/ folder is published: the Bright Site Tech page plus the samples in site/demos/.
    # (docs/, tools/, brand/ and videos/ are not served.)
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
